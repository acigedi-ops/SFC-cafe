<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Sign – SFC Cafe</title>
<script src="/qrcode.js"></script>
<style>
  @font-face { font-family: 'Playfair Display'; font-weight: 800; src: url('/playfair-800.woff2') format('woff2'); }
  @font-face { font-family: 'Jost'; font-weight: 400; src: url('/jost-400.woff2') format('woff2'); }
  @font-face { font-family: 'Jost'; font-weight: 500; src: url('/jost-500.woff2') format('woff2'); }
  @page { size: letter; margin: 0.4in; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Jost', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #3a2418; background: #e9e1d5; }
  .controls { max-width: 7.7in; margin: 16px auto; padding: 0 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .controls input { flex: 1; min-width: 220px; padding: 10px 14px; border-radius: 999px; border: 1px solid #c9b49a; font-size: 15px; font-family: inherit; }
  .controls button { padding: 10px 20px; border: 0; border-radius: 999px; background: #3a2418; color: #fbf7f0; font-weight: 500; font-size: 15px; font-family: inherit; }
  .page { width: 7.7in; min-height: 10.1in; margin: 0 auto 30px; background: #f6efe4; padding: 0.55in 0.6in; text-align: center; border: 2px solid #3a2418; outline: 1px solid #3a2418; outline-offset: -14px; }
  .page h1 { font-family: 'Playfair Display', Georgia, serif; font-weight: 800; font-size: 92px; line-height: 1; margin: 6px 0 0; text-transform: uppercase; }
  .page h2 { display: flex; align-items: center; gap: 18px; font-size: 22px; letter-spacing: 6px; text-transform: uppercase; font-weight: 500; margin: 18px 0 34px; }
  .page h2::before, .page h2::after { content: ''; flex: 1; height: 1.5px; background: #3a2418; }
  #qr { display: inline-block; padding: 18px; background: #fffdf9; border: 1.5px solid #3a2418; }
  #qr svg, #qr img { width: 4.2in; height: 4.2in; display: block; }
  .steps { display: flex; justify-content: center; gap: 40px; margin-top: 34px; font-size: 17px; letter-spacing: 2px; text-transform: uppercase; font-weight: 500; }
  .steps span { display: block; font-size: 30px; margin-bottom: 6px; letter-spacing: 0; }
  .url { margin-top: 20px; font-size: 14px; color: #8a7363; word-break: break-all; letter-spacing: 1px; }
  .free { margin-top: 18px; font-family: 'Playfair Display', Georgia, serif; font-weight: 800; font-size: 24px; }
  @media print { body { background: #f6efe4; -webkit-print-color-adjust: exact; print-color-adjust: exact; } .controls { display: none; } .page { margin: 0; } }
</style>
</head>
<body>
<div class="controls">
  <input id="url" aria-label="Order page address">
  <button onclick="draw()">Update QR</button>
  <button onclick="window.print()">Print</button>
</div>
<div class="page">
  <h1 id="shop">SFC Cafe</h1>
  <h2>Scan to order ☕</h2>
  <div id="qr"></div>
  <div class="steps">
    <div><span>📷</span>Scan</div>
    <div><span>🥤</span>Pick a drink</div>
    <div><span>📱</span>Watch your phone<br>for “Ready”</div>
  </div>
  <div class="url" id="urlText"></div>
</div>
<script>
const u = document.getElementById('url');
u.value = location.origin + '/';
function draw() {
  const qr = qrcode(0, 'M'); qr.addData(u.value.trim()); qr.make();
  document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
  document.getElementById('urlText').textContent = u.value.trim();
}
fetch('/api/menu').then(r => r.json()).then(j => { document.getElementById('shop').textContent = j.shopName; });
draw();
</script>
</body>
</html>
