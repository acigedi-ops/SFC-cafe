<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Sign – SFC Cafe</title>
<script src="/qrcode.js"></script>
<style>
  @page { size: letter; margin: 0.5in; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #2b1d14; background: #eee; }
  .controls { max-width: 7.5in; margin: 16px auto; padding: 0 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .controls input { flex: 1; min-width: 220px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; }
  .controls button { padding: 10px 18px; border: 0; border-radius: 8px; background: #6b3e26; color: #fff; font-weight: 700; font-size: 15px; }
  .page { width: 7.5in; min-height: 10in; margin: 0 auto 30px; background: #fff; padding: 0.6in 0.5in; text-align: center; border: 10px solid #6b3e26; border-radius: 24px; }
  .page h1 { font-size: 64px; margin: 0; letter-spacing: -1px; }
  .page h2 { font-size: 34px; margin: 10px 0 30px; font-weight: 600; color: #6b3e26; }
  #qr svg, #qr img { width: 4.6in; height: 4.6in; }
  .steps { display: flex; justify-content: center; gap: 28px; margin-top: 30px; font-size: 20px; font-weight: 600; }
  .steps span { display: block; font-size: 34px; }
  .url { margin-top: 22px; font-size: 16px; color: #7a6a5f; word-break: break-all; }
  .free { margin-top: 14px; font-size: 20px; }
  @media print { body { background: #fff; } .controls { display: none; } .page { margin: 0; border-width: 8px; } }
</style>
</head>
<body>
<div class="controls">
  <input id="url" aria-label="Order page address">
  <button id="drawBtn">Update QR</button>
  <button id="printBtn">Print</button>
</div>
<div class="page">
  <h1 id="shop">SFC Cafe</h1>
  <h2>Scan to order ☕</h2>
  <div id="qr"></div>
  <div class="steps">
    <div><span>📷</span>Scan</div>
    <div><span>🥤</span>Pick a drink</div>
    <div><span>📱</span>Watch your phone<br>for “Ready”</div>
  </div>
  <p class="free">Pay when you pick up</p>
  <div class="url" id="urlText"></div>
</div>
<script>
const u = document.getElementById('url');
u.value = location.origin + '/';
function draw() {
  const qr = qrcode(0, 'M'); qr.addData(u.value.trim()); qr.make();
  document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
  document.getElementById('urlText').textContent = u.value.trim();
}
fetch('/api/menu').then(r => r.json()).then(j => { document.getElementById('shop').textContent = j.shopName; });
document.getElementById('drawBtn').addEventListener('click', draw);
document.getElementById('printBtn').addEventListener('click', () => window.print());
draw();
</script>
</body>
</html>
