<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6efe4">
<title>Your order – SFC Cafe</title>
<link rel="stylesheet" href="/style.css">
<style>
  header.top { padding-top: 26px; }
  header.top h1 { font-size: clamp(36px, 10vw, 48px); }
  .hero { position: relative; text-align: center; padding: 30px 20px 26px; margin-top: 22px; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); }

  .hero .lbl { text-transform: uppercase; letter-spacing: 3px; font-size: 12px; color: var(--muted); font-weight: 500; }
  .hero .num { font-family: var(--serif); font-size: 84px; font-weight: 800; line-height: 1; margin: 8px 0 22px; }
  .hero .perf { position: relative; border-top: 2px dashed var(--line); margin: 0 -20px 20px; }
  .hero .perf::before, .hero .perf::after { content: ''; position: absolute; top: -13px; width: 24px; height: 24px; border-radius: 50%; background: var(--bg); }
  .hero .perf::before { left: -12px; } .hero .perf::after { right: -12px; }
  .hero .msg { font-family: var(--serif); font-size: 24px; font-weight: 700; line-height: 1.25; }
  .steps { display: flex; justify-content: space-between; margin: 24px 4px 2px; position: relative; }
  .steps::before { content: ''; position: absolute; top: 14px; left: 16%; right: 16%; height: 2px; background: var(--line); }
  .step { flex: 1; text-align: center; position: relative; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; color: var(--muted); }
  .dot { width: 30px; height: 30px; border-radius: 50%; background: var(--card); border: 2px solid var(--rule); margin: 0 auto 8px; display: grid; place-items: center; font-size: 14px; }
  .step.on { color: var(--ink); }
  .step.on .dot { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .ready .hero { background: var(--accent); color: #fff; animation: pop .5s ease; }
  .ready .hero .num, .ready .hero .lbl, .ready .step, .ready .step.on { color: #fff; }
  .ready .hero .perf { border-color: rgba(255, 255, 255, .35); }
  .ready .step.on .dot { background: #fff; border-color: #fff; color: var(--accent); }
  @keyframes pop { 0% { transform: scale(.96); } 60% { transform: scale(1.02); } 100% { transform: scale(1); } }
  .items { padding: 6px 20px; margin-top: 16px; }
  .items h3 { margin: 14px 0 4px; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  .line { padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .line:last-child { border: 0; }
  .line b { font-weight: 500; font-size: 17px; }
  .sum b:last-child { font-family: var(--serif); font-size: 22px; }
  .again { text-align: center; margin-top: 24px; }
  .again a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule); padding-bottom: 2px; letter-spacing: 2px; text-transform: uppercase; font-size: 13px; font-weight: 500; }
</style>
</head>
<body>
<header class="top"><h1 id="shop">SFC Cafe</h1><p>Your order</p></header>
<div class="wrap" style="padding-bottom:0"><button class="btn block green" id="alertBtn" style="margin-top:16px;display:none">🔔 Tap here so your phone beeps when it's ready</button>
<div id="alertOn" class="notice" style="display:none;background:#e2ead8;color:#3c5527">🔔 Alert is on. Keep this page open with your screen on.</div></div>
<div class="wrap" id="root"><p class="muted" style="text-align:center;margin-top:40px">Loading…</p></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => '$' + Number(n).toFixed(2);
const params = new URLSearchParams(location.search);
const oid = params.get('id');
let timer, prev = null, audioCtx = null, flashT = null;
function beep() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  for (let r = 0; r < 3; r++) [880, 1175, 1568].forEach((f, i) => {
    const st = t + r * 0.9 + i * 0.16, o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = f; g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(0.5, st + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, st + 0.15);
    o.connect(g).connect(audioCtx.destination); o.start(st); o.stop(st + 0.17);
  });
}
function readyAlert(o) {
  beep();
  try { navigator.vibrate && navigator.vibrate([500, 200, 500, 200, 500]); } catch (e) {}
  try { if (window.Notification && Notification.permission === 'granted') new Notification('Your order #' + o.number + ' is ready! ☕', { body: 'Come pick it up at the counter.', tag: 'sfc-ready' }); } catch (e) {}
  const base = document.title; let on = false; clearInterval(flashT);
  flashT = setInterval(() => { document.title = (on = !on) ? '🔔 READY! #' + o.number : base; }, 800);
  setTimeout(() => { clearInterval(flashT); document.title = base; }, 60000);
}
const alertBtn = document.getElementById('alertBtn');
alertBtn.onclick = async () => {
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); await audioCtx.resume(); const o = audioCtx.createOscillator(), g = audioCtx.createGain(); g.gain.value = 0.0001; o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.05); } catch (e) {}
  alertBtn.style.display = 'none'; document.getElementById('alertOn').style.display = 'block';
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
  try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission().catch(() => {}); } catch (e) {}
};
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && oid) load(); });
async function load() {
  const r = await fetch('/api/orders/' + encodeURIComponent(oid) + '/public');
  if (!r.ok) { $('#root').innerHTML = '<div class="notice err">We could not find that order.</div><a class="btn block" href="/">Back to menu</a>'; return; }
  const o = await r.json();
  $('#shop').textContent = o.shopName;
  const steps = ['new', 'making', 'ready'];
  const idx = o.status === 'done' ? 3 : steps.indexOf(o.status);
  let msg;
  if (o.status === 'cancelled') msg = 'This order was cancelled. Please see the counter.';
  else if (o.status === 'done') msg = 'Picked up. Enjoy! ☕';
  else if (o.status === 'ready') msg = `${esc(o.firstName)}, your order is ready! 🎉`;
  else if (o.status === 'making') msg = 'We\'re making your order now.';
  else msg = o.ahead ? `Got it! ${o.ahead} order${o.ahead === 1 ? '' : 's'} ahead of you.` : 'Got it! You\'re next.';
  document.body.classList.toggle('ready', o.status === 'ready');
  if (prev && prev !== 'ready' && o.status === 'ready') readyAlert(o);
  prev = o.status;
  const waiting = ['new', 'making'].includes(o.status);
  if (!waiting) { alertBtn.style.display = 'none'; document.getElementById('alertOn').style.display = 'none'; }
  else if (document.getElementById('alertOn').style.display !== 'block') alertBtn.style.display = 'block';
  $('#root').innerHTML = `
    ${params.get('new') ? '<div class="notice" style="background:#e2ead8;color:#3c5527">Thanks, ' + esc(o.firstName) + '! Your order was placed.</div>' : ''}
    <div class="hero card">
      <div class="lbl">Confirmation number</div>
      <div class="num">#${o.number}</div>
      <div class="perf"></div>
      <div class="msg">${msg}</div>
      ${o.status !== 'cancelled' ? `<div class="steps">
        ${['Received', 'Making', 'Ready'].map((t, i) => `<div class="step ${i <= idx ? 'on' : ''}"><div class="dot">${i <= idx ? '✓' : ''}</div>${t}</div>`).join('')}
      </div>` : ''}
    </div>
    <p class="muted small" style="text-align:center">${o.sms ? "We'll also text you when it's ready. " : ''}Keep this page open. It updates by itself and beeps when your order is ready.<br>Show this number at the counter.</p>
    <div class="items card"><h3>Your order</h3>
      ${o.items.map(i => `<div class="line"><b>${i.qty}× ${esc(i.name)}</b>
        <div class="muted small">${esc(i.options.map(x => x.choice).join(', '))}${i.note ? '<br>Note: ' + esc(i.note) : ''}</div></div>`).join('')}
      ${o.note ? `<div class="line"><span class="muted small">Order note:</span> ${esc(o.note)}</div>` : ''}
      <div class="line sum" style="display:flex;justify-content:space-between;align-items:baseline"><b>Total</b><b>${fmt(o.total)}</b></div>
    </div>
    <p class="again"><a href="/">Order something else</a></p>`;
  if (['done', 'cancelled'].includes(o.status)) clearInterval(timer);
}
if (!oid) location.href = '/';
else { load(); timer = setInterval(load, 3000); }
</script>
</body>
</html>
